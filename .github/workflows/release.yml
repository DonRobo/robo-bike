name: Release

# Builds the signed release APK for a version tag (v0.1.0, ...) and attaches it to a GitHub Release.
# Runs only for pushed tags, never for pull requests. Secrets: see docs/DEVELOPMENT.md ("Releases").
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The tag must match versionName in app/build.gradle.kts (F-Droid reads the version from there).
      - name: Check tag against versionName
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $name"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ROBOBIKE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::secret ROBOBIKE_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          ROBOBIKE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ROBOBIKE_KEYSTORE_PASSWORD: ${{ secrets.ROBOBIKE_KEYSTORE_PASSWORD }}
          ROBOBIKE_KEY_ALIAS: ${{ secrets.ROBOBIKE_KEY_ALIAS }}
          ROBOBIKE_KEY_PASSWORD: ${{ secrets.ROBOBIKE_KEY_PASSWORD }}
        run: ./gradlew --stacktrace :app:testDebugUnitTest :app:assembleRelease

      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::no signed APK (unsigned build?)"; exit 1; }
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$apk"
          cp "$apk" "robo-bike-${{ steps.version.outputs.name }}.apk"
          sha256sum "robo-bike-${{ steps.version.outputs.name }}.apk" > "robo-bike-${{ steps.version.outputs.name }}.apk.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt
          test -f "$notes" || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Robo Bike ${{ steps.version.outputs.name }}" \
            --notes-file "$notes" \
            "robo-bike-${{ steps.version.outputs.name }}.apk" "robo-bike-${{ steps.version.outputs.name }}.apk.sha256"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
