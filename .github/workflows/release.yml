name: Release

# Builds the signed release APK when a GitHub Release is published and attaches it to that release.
# The version comes from the release's tag (v1.2.3), the notes are what was written in the release.
# Never runs for pull requests. Secrets: see docs/DEVELOPMENT.md ("Releases").
on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # app/build.gradle.kts turns the tag into versionName/versionCode; only plain v<major>.<minor>.<patch> is a release.
      - name: Check tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag $TAG is not v<major>.<minor>.<patch>"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ROBOBIKE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::secret ROBOBIKE_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          ROBOBIKE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ROBOBIKE_KEYSTORE_PASSWORD: ${{ secrets.ROBOBIKE_KEYSTORE_PASSWORD }}
          ROBOBIKE_KEY_ALIAS: ${{ secrets.ROBOBIKE_KEY_ALIAS }}
          ROBOBIKE_KEY_PASSWORD: ${{ secrets.ROBOBIKE_KEY_PASSWORD }}
        run: ./gradlew --stacktrace -PreleaseTag=${{ steps.version.outputs.tag }} :app:testDebugUnitTest :app:assembleRelease

      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::no signed APK (unsigned build?)"; exit 1; }
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$apk"
          cp "$apk" "robo-bike-${{ steps.version.outputs.name }}.apk"
          sha256sum "robo-bike-${{ steps.version.outputs.name }}.apk" > "robo-bike-${{ steps.version.outputs.name }}.apk.sha256"

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "robo-bike-${{ steps.version.outputs.name }}.apk" "robo-bike-${{ steps.version.outputs.name }}.apk.sha256"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
